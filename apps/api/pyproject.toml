[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelliflood-api"
version = "0.1.0"
description = "IntelliFlood backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "alembic",
    "geoalchemy2",
    "psycopg[binary]",
    "shapely",
    "PyJWT",
    "numpy",
    "scipy",
    "Pillow",
    "paho-mqtt",
    "cryptography>=42",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.geojson"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
