<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>IntelliFlood desktop preview</title>
    <style>
      html, body { margin: 0; background: #04070d; overflow: hidden; }
      #frame {
        position: absolute;
        border: 0;
        transform-origin: top left;
      }
    </style>
  </head>
  <body>
    <iframe id="frame"></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const frame = document.getElementById("frame");
      const width = Number(params.get("w") || 1440);
      const height = Number(params.get("h") || 900);
      const scale = Number(params.get("s") || 0.54);
      const x = Number(params.get("x") || 0);
      const y = Number(params.get("y") || 0);
      frame.style.width = width + "px";
      frame.style.height = height + "px";
      frame.style.transform = `scale(${scale}) translate(${-x}px, ${-y}px)`;
      frame.src = params.get("src") || "/app/#carte";
    </script>
  </body>
</html>
